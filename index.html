<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyecto HA</title>
<link rel="preconnect" href="[https://fonts.googleapis.com](https://fonts.googleapis.com)">
<link rel="preconnect" href="[https://fonts.gstatic.com](https://fonts.gstatic.com)" crossorigin>
<link href="[https://fonts.googleapis.com/css2?family=Fuzzy+Bubbles:wght@700&display=swap](https://fonts.googleapis.com/css2?family=Fuzzy+Bubbles:wght@700&display=swap)" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body {
margin: 0;
height: 100%;
font-family: 'Comic Sans MS', Arial, sans-serif;
}
.pantalla {
display: none;
position: fixed;
inset: 0;
}
.pantalla.activa { display: flex; }
/* Pantalla 1 */
#pantalla1 {
background: #222;
color: #fff;
align-items: center;
justify-content: center;
}
.encabezado {
position: absolute;
top: 0;
left: 0;
right: 0;
padding: 16px;
background: #000;
color: #EDD308;
text-align: center;
font-weight: 700;
font-size: clamp(1.4rem, 5vw, 2.2rem);
font-family: "Fuzzy Bubbles", "Comic Sans MS", cursive;
border-bottom: 3px solid #EDD308;
}
.formulario, .formulario label, .formulario input, .formulario textarea, .formulario button, .creditos {
font-family: "Fuzzy Bubbles", "Comic Sans MS", cursive;
font-weight: 700;
}
.formulario {
width: min(560px, 90vw);
display: flex;
flex-direction: column;
gap: 16px;
}
.formulario label { letter-spacing: 1px; }
.formulario input, .formulario textarea {
width: 100%;
padding: 12px;
font-size: 1.1rem;
border-radius: 6px;
border: 2px solid #555;
background: #fff;
color: #000;
font-family: inherit;
}
.formulario textarea {
resize: vertical;
min-height: 120px;
}
.campo {
display: flex;
flex-direction: row-reverse;
align-items: flex-start;
gap: 10px;
}
.btnBorrar {
flex: none;
width: 48px;
height: 48px;
border: none;
border-radius: 6px;
background: #c62828;
color: #fff;
font-size: 1.3rem;
cursor: pointer;
}
.btnBorrar:hover { background: #e53935; }
.acciones {
display: flex;
flex-align: center;
gap: 16px;
flex-wrap: wrap;
}
.creditos {
color: #ddd;
font-size: 0.95rem;
}
#btnPlay {
display: flex;
align-items: center;
gap: 10px;
padding: 12px 24px;
font-size: 1.1rem;
border: none;
border-radius: 6px;
background: #EDD308;
color: #000;
font-weight: 700;
cursor: pointer;
}
#btnPlay:hover { filter: brightness(1.1); }
#btnPlay svg { width: 22px; height: 22px; fill: #000; }
/* Pantalla 2 */
#pantalla2 {
background: #111;
align-items: center;
justify-content: center;
}
.dialogo {
position: relative;
width: 94vw;
}
.recuadro1 {
position: absolute;
top: 0;
left: 3vw;
transform: translateY(-60%);
background: #000;
color: #fff;
padding: 8px 48px 8px 20px;
min-width: 26vw;
font-size: clamp(1.6rem, 4vw, 3rem);
font-weight: 700;
font-family: "Fuzzy Bubbles", "Comic Sans MS", cursive;
line-height: 1.2;
border: 2px solid #000;
z-index: 2;
}
.recuadro2 {
--renglon: clamp(26px, 4.2vh, 44px);
background-color: #EDD308;
background-image: repeating-linear-gradient(
to bottom,
transparent 0, transparent calc(var(--renglon) - 2px),
#000 calc(var(--renglon) - 2px), #000 var(--renglon)
);
height: calc(var(--renglon) * 10);
border: 3px solid #000;
border-radius: 6px;
padding: calc(var(--renglon) * 2) 20px 0;
font-family: "Fuzzy Bubbles", "Comic Sans MS", cursive;
font-weight: 700;
font-size: calc(var(--renglon) * 1.2);
line-height: calc(var(--renglon) * 2);
color: #000;
overflow: hidden;
white-space: pre-wrap;
word-break: break-word;
box-shadow: 0 8px 24px rgba(0,0,0,.6);
}
#btnCerrar {
position: absolute;
top: 16px;
right: 16px;
width: 48px;
height: 48px;
border: 2px solid #fff;
border-radius: 50%;
background: #000;
color: #fff;
font-size: 1.6rem;
line-height: 1;
cursor: pointer;
}
#btnCerrar:hover { background: #c00; }
</style>
</head>
<body>
<!-- Pantalla 1 -->
<section id="pantalla1" class="pantalla activa">
<header class="encabezado">Romance Alone 2</header>
<div class="formulario">
<label for="NOMBRE">NOMBRE</label>
<div class="campo">
<button type="button" class="btnBorrar" data-target="NOMBRE" aria-label="Borrar NOMBRE" title="Borrar">🗑</button>
<input type="text" id="NOMBRE" name="NOMBRE" placeholder="Nombre del personaje">
</div>
<label for="TEXTO">TEXTO</label>
<div class="campo">
<button type="button" class="btnBorrar" data-target="TEXTO" aria-label="Borrar TEXTO" title="Borrar">🗑</button>
<textarea id="TEXTO" name="TEXTO" placeholder="Texto de diálogo del personaje"></textarea>
</div>
<div class="acciones">
<button id="btnPlay" type="button" aria-label="Reproducir">
<svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg> Play
</button>
<span class="creditos">🎂 hecho por Guillermo Requena</span>
</div>
</div>
</section>
<!-- Pantalla 2 -->
<section id="pantalla2" class="pantalla">
<button id="btnCerrar" type="button" aria-label="Cerrar">×</button>
<div class="dialogo">
<div class="recuadro1" id="recuadroNombre"></div>
<div class="recuadro2" id="recuadroTexto"></div>
</div>
</section>
<audio id="sonido" src="AUD-20260912-WA0002.mp3" preload="auto" loop></audio>
<script>
const p1 = document.getElementById('pantalla1');
const p2 = document.getElementById('pantalla2');
const sonido = document.getElementById('sonido');
const rNombre = document.getElementById('recuadroNombre');
const rTexto = document.getElementById('recuadroTexto');
let timer = null;
function detener() {
clearInterval(timer);
timer = null;
sonido.pause();
sonido.currentTime = 0;
}
function mostrar(pantalla) {
p1.classList.toggle('activa', pantalla === 1);
p2.classList.toggle('activa', pantalla === 2);
}
document.getElementById('btnPlay').addEventListener('click', () => {
const nombre = document.getElementById('NOMBRE').value;
const texto = document.getElementById('TEXTO').value;
rNombre.textContent = nombre;
rTexto.textContent = '';
mostrar(2);
detener();
if (!texto.length) return;
sonido.loop = true;
sonido.volume = 1;
const empezar = () => {
let i = 0;
timer = setInterval(() => {
i++;
rTexto.textContent = texto.slice(0, i);
if (i >= texto.length) detener();
}, 60);
};
sonido.play().then(empezar).catch(err => {
console.error('No se pudo reproducir el audio:', err);
empezar();
});
});
document.querySelectorAll('.btnBorrar').forEach(b => {
b.addEventListener('click', () => {
const campo = document.getElementById(b.dataset.target);
campo.value = '';
campo.focus();
});
});
document.getElementById('btnCerrar').addEventListener('click', () => {
detener();
mostrar(1);
});
</script>
</body>
</html>
